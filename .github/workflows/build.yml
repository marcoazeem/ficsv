name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ficsv-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ficsv-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ficsv-macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ficsv.exe dist/
          Compress-Archive -Path dist/ficsv.exe -DestinationPath ${{ matrix.artifact }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh target/${{ matrix.target }}/release/ficsv dist
          codesign --force --deep --sign - dist/ficsv.app
          ditto -c -k --keepParent dist/ficsv.app ${{ matrix.artifact }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            ## Downloads
            - **macOS (Apple Silicon)**: `ficsv-macos-arm64.zip`
            - **macOS (Intel)**: `ficsv-macos-x64.zip`
            - **Windows (64-bit)**: `ficsv-windows-x64.zip`

            The builds are not notarized / code-signed with a paid certificate:
            - macOS: unzip, then right-click `ficsv.app` → **Open** the first time (or run `xattr -dr com.apple.quarantine ficsv.app`).
            - Windows: SmartScreen may warn — click **More info → Run anyway**.
