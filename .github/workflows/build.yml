name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: ficsv-windows-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: ficsv-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: ficsv-macos-x64
          # Ubuntu 22.04 → glibc 2.35, so the binary also runs on older distros.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            artifact: ficsv-linux-x64
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: ficsv-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install system libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev libgl1-mesa-dev libgtk-3-dev
      - name: Test
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --release
      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/${{ matrix.target }}/release/ficsv.exe "dist/FI CSV.exe"
          Compress-Archive -Path "dist/FI CSV.exe" -DestinationPath ${{ matrix.artifact }}.zip
      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          ./scripts/bundle-macos.sh target/${{ matrix.target }}/release/ficsv dist
          codesign --force --deep --sign - "dist/FI CSV.app"
          ditto -c -k --norsrc --keepParent "dist/FI CSV.app" ${{ matrix.artifact }}.zip
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          ./scripts/package-linux.sh target/${{ matrix.target }}/release/ficsv dist ${{ matrix.artifact }}
          (cd dist && zip -r -X ../${{ matrix.artifact }}.zip ${{ matrix.artifact }})
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
          body: |
            ## Downloads
            - **macOS (Apple Silicon)**: `ficsv-macos-arm64.zip`
            - **macOS (Intel)**: `ficsv-macos-x64.zip`
            - **Windows (64-bit)**: `ficsv-windows-x64.zip`
            - **Linux (x86-64)**: `ficsv-linux-x64.zip` · **Linux (ARM64)**: `ficsv-linux-arm64.zip`

            The builds are not notarized / code-signed with a paid certificate:
            - macOS: unzip, then right-click **FI CSV.app** → **Open** the first time (or run `xattr -dr com.apple.quarantine "FI CSV.app"`).
            - Windows: SmartScreen may warn — click **More info → Run anyway**.
            - Linux: unzip and run `./install.sh` (installs to `~/.local/bin` with a menu entry), or just run `./ficsv`.
