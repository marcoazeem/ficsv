[package]
name = "ficsv"
version = "0.2.1"
edition = "2024"

[dependencies]
chrono = "0.4.45"
eframe = "0.35.0"
egui = "0.35"
encoding_rs = "0.8.44"
memchr = "2.8.3"
memmap2 = "0.9.12"
open = "5.4.5"
quick-xml = "0.42.0"
rand = "0.10.4"
rayon = "1.12.0"
regex = "1.13.2"
rfd = "0.18.0"
self-replace = "1.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
unicode-bidi = "0.3.18"
ureq = "2"
uuid = { version = "1.29.3", features = ["v4", "v7"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[build-dependencies]
winresource = "0.1.34"
